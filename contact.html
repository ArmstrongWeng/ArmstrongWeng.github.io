<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 | 上海赞硕</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #fff; color: #1e293b; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
        .navbar { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.04); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(8px); }
        .nav-container { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 16px 0; }
        .logo { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #2563eb, #1e40af); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-links { display: flex; gap: 32px; list-style: none; }
        .nav-links a { text-decoration: none; font-weight: 500; color: #334155; }
        .nav-links a:hover, .nav-links a.active { color: #2563eb; }
        .mobile-toggle { display: none; font-size: 1.6rem; cursor: pointer; background: none; border: none; }
        footer { background: #f8fafc; border-top: 1px solid #e2e8f0; padding: 48px 0 32px; margin-top: 80px; }
        .footer-grid { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px; }
        .footer-col h4 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
        .footer-col p, .footer-col a { color: #475569; text-decoration: none; font-size: 0.9rem; }
        .copyright { text-align: center; margin-top: 48px; padding-top: 24px; border-top: 1px solid #e2e8f0; font-size: 0.8rem; }
        section { padding: 80px 0; }
        .section-title { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        .contact-wrapper { display: flex; flex-wrap: wrap; gap: 48px; }
        .contact-form { flex: 2; }
        .contact-info { flex: 1; background: #f8fafc; border-radius: 28px; padding: 32px; }
        .form-group { margin-bottom: 24px; }
        input, textarea { width: 100%; padding: 14px 18px; border: 1px solid #e2e8f0; border-radius: 24px; font-family: 'Inter', sans-serif; font-size: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-primary { display: inline-flex; align-items: center; gap: 8px; background: #2563eb; color: white; padding: 12px 28px; border-radius: 40px; font-weight: 600; border: none; cursor: pointer; }
        .contact-detail { margin: 24px 0; display: flex; align-items: center; gap: 14px; color: #334155; }
        .contact-detail i { width: 32px; font-size: 1.3rem; color: #2563eb; }
        @media (max-width: 768px) {
            .nav-links { display: none; width: 100%; flex-direction: column; }
            .nav-links.show { display: flex; }
            .mobile-toggle { display: block; }
            .section-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

        <ul class="nav-links" id="navLinks">

            <li><a href="contact.html" class="active">联系我们</a></li>
        </ul>
    </div>
</nav>

                    <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i> 发送消息</button>

                </form>
            </div>
